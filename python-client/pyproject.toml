[project]
name = "harness-client"
version = "0.1.0"
description = "Python client for the harness kernel — ctypes ABI wrapper plus build-from-source cache"
requires-python = ">=3.10"
dependencies = ["numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness_client*"]
