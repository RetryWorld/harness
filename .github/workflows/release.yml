name: release

# One workflow builds both Linux architectures the curl installer supports
# from the same tag. Each tarball comes from scripts/build_artifact.sh with the
# same tests, sanitizer pass, and manifest format.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  BUF_VERSION: '1.72.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build protobuf-compiler libprotobuf-dev libyaml-cpp-dev nlohmann-json3-dev libssl-dev libsqlite3-dev libcurl4-openssl-dev

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}

      - name: Generate C++ schemas
        working-directory: schemas
        run: >-
          buf generate
          --template '{"version":"v2","plugins":[{"protoc_builtin":"cpp","out":"gen/cpp"}]}'

      - name: Isolation check
        run: ./scripts/isolation_check.sh

      - name: Build, test, package
        run: ./scripts/build_artifact.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
