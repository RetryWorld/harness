name: release

# One workflow builds both Linux architectures the curl installer supports
# from the same tag. Each tarball comes from scripts/build_artifact.sh with the
# same tests, sanitizer pass, and manifest format.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  BUF_VERSION: '1.72.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build protobuf-compiler libprotobuf-dev libyaml-cpp-dev nlohmann-json3-dev libssl-dev libsqlite3-dev libcurl4-openssl-dev

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install ROS 2 discovery dependencies
        run: >-
          sudo apt-get install -y
          ros-jazzy-rclcpp ros-jazzy-rosbag2-cpp
          ros-jazzy-sensor-msgs ros-jazzy-std-msgs
          ros-jazzy-trajectory-msgs ros-jazzy-rosgraph-msgs

      - name: Generate C++ schemas
        working-directory: schemas
        run: >-
          buf generate
          --template '{"version":"v2","plugins":[{"protoc_builtin":"cpp","out":"gen/cpp"}]}'

      - name: Isolation check
        run: ./scripts/isolation_check.sh

      - name: Build, test, package
        run: |
          source /opt/ros/jazzy/setup.bash
          build_log="${RUNNER_TEMP}/rearguard-release-build.log"
          if ! HARNESS_WITH_ROS2=ON ./scripts/build_artifact.sh "${GITHUB_REF_NAME#v}" >"${build_log}" 2>&1; then
            cat "${build_log}"
            grep -E 'FAILED:|fatal error:|error:|CMake Error|tests failed|ninja: build stopped' "${build_log}" |
              tail -20 |
              while IFS= read -r failure; do
                failure="${failure//'%'/'%25'}"
                failure="${failure//$'\r'/'%0D'}"
                failure="${failure//$'\n'/'%0A'}"
                echo "::error title=ROS-enabled release build failed::${failure}"
              done
            exit 1
          fi
          cat "${build_log}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
